[project]
name = "deepagents-graph-memory"
version = "0.1.8"
description = "Graph-backed context scratchpad for LangChain Deep Agents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "licenses/*"]
authors = [
    { name = "Pranav Bedi", email = "pranavbedi80@gmail.com" },
    { name = "Taha Khan", email = "ktaha2005.net@gmail.com" }
]
requires-python = ">=3.11,<3.15"
keywords = ["deepagents", "langchain", "langgraph", "context", "graph", "ladybug"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "deepagents>=0.6.10",
    "langchain-core>=1.4.0,<2.0.0",
    "wcmatch>=10.1",
]

[project.optional-dependencies]
test = [
    "ladybug==0.20.3",
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.12.2,<0.16.0",
]

[project.urls]
Repository = "https://github.com/TahaK29/deepagents-graph-memory"
Documentation = "https://github.com/TahaK29/deepagents-graph-memory#readme"
Issues = "https://github.com/TahaK29/deepagents-graph-memory/issues"

[build-system]
requires = ["setuptools>=77.0.0", "wheel", "ladybug==0.20.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
"deepagents_graph_memory" = ["py.typed"]

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["ANN", "B", "D", "E", "F", "I", "UP"]
ignore = [
    "ANN401",
    "D107",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["deepagents_graph_memory"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "D", "S101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.cibuildwheel]
build = "cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux* *-win32"
test-requires = ["pytest>=8", "pytest-asyncio>=1"]
test-command = [
    "python {project}/scripts/check_wheel.py",
    'cd "{project}" && python -m pytest -q tests',
]

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
before-all = "bash {project}/scripts/build_openssl.sh"
environment = { LD_LIBRARY_PATH = "/opt/graph-memory-openssl/lib:$LD_LIBRARY_PATH" }

[tool.cibuildwheel.macos]
before-all = "brew install openssl@3"
environment = { MACOSX_DEPLOYMENT_TARGET = "15.0" }

[tool.cibuildwheel.windows]
before-build = "pip install delvewheel"
repair-wheel-command = 'delvewheel repair --ignore-existing --analyze-existing --with-mangle --add-path "%GRAPH_MEMORY_BUILD_OPENSSL%" -w {dest_dir} {wheel}'
test-command = [
    "python {project}/scripts/check_wheel.py",
    'cd /d "{project}" && python -m pytest -q tests',
]
