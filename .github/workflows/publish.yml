name: Publish to PyPI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency: pypi-publish

jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download tested wheels for this exact revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow tests.yml --commit "$GITHUB_SHA" --json databaseId,conclusion --jq '[.[] | select(.conclusion == "success")][0].databaseId')
          [[ "$run_id" =~ ^[0-9]+$ ]]
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --pattern 'native-wheels-*' --dir artifacts
          python scripts/collect_wheels.py
      - name: Validate distributions
        run: |
          python -m pip install twine
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/deepagents-graph-memory/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
