name: Publish to PyPI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency: pypi-publish

jobs:
  wheels:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/wheels.yml
    with:
      run-tests: false

  collect:
    needs: wheels
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: native-wheels-*
          path: artifacts
      - run: python scripts/collect_wheels.py
      - name: Check one installed wheel and subagent behavior
        run: |
          python -m pip install dist/*cp311*manylinux*x86_64.whl pytest pytest-asyncio
          python scripts/check_wheel.py
          python -m pytest -q tests/test_tools.py tests/test_combined_context.py
      - name: Validate distributions
        run: |
          python -m pip install twine
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/deepagents-graph-memory/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
