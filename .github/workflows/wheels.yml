name: Build and test native wheels

on:
  workflow_call:

permissions:
  contents: read

jobs:
  wheels:
    name: ${{ matrix.platform.os }} / ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        python: ['cp311', 'cp312', 'cp313', 'cp314']
        platform:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
          - os: macos-15
            arch: arm64
    runs-on: ${{ matrix.platform.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build, repair, and test wheels
        uses: pypa/cibuildwheel@v3.2.0
        env:
          CIBW_ARCHS: ${{ matrix.platform.arch }}
          CIBW_BUILD: ${{ matrix.python }}-*
      - uses: actions/upload-artifact@v4
        with:
          name: native-wheels-${{ matrix.platform.os }}-${{ matrix.python }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          compression-level: 0
