name: Tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    uses: ./.github/workflows/wheels.yml
  compatibility:
    needs: wheels
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        deepagents: ['0.6.10', '0.6.12', '0.7.1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: native-wheels-ubuntu-latest-cp311
          path: wheelhouse
      - name: Test older Deep Agents with the installed wheel
        run: |
          python -m pip install wheelhouse/*cp311*.whl "deepagents==${{ matrix.deepagents }}" pytest pytest-asyncio
          python -m pip check
          python -m pytest -q
          python scripts/check_wheel.py
      - name: Verify offline operation and standalone Ladybug upgrades
        run: |
          sudo unshare --net "$(command -v python)" scripts/check_wheel.py
          python -m pip install ladybug==0.20.3
          python scripts/check_coexistence.py
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'ruff>=0.12.2,<0.16.0'
      - run: python -m ruff check .
