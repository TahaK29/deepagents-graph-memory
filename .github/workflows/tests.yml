name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install ".[test]"
      - name: Verify Ladybug is the only installed graph engine
        run: python -c "import importlib.util; import ladybug; assert importlib.util.find_spec('kuzu') is None"
      - name: Diagnose Windows native binding
        if: runner.os == 'Windows'
        run: python -c "import ssl, sys; print(ssl.OPENSSL_VERSION, sys.base_prefix, flush=True); import ladybug._lbug"
      - name: Provision the Ladybug FTS extension
        # Standard CPython loads the OpenSSL DLLs needed by Ladybug on Windows.
        run: python -c "import ssl; import ladybug; db = ladybug.Database(':memory:'); conn = ladybug.Connection(db); conn.execute('INSTALL fts;').close(); conn.close(); db.close()"
      - name: Test
        run: python -m pytest
      - name: Lint
        run: python -m ruff check .
      - name: Verify FTS with native networking disabled
        if: runner.os == 'Linux'
        shell: bash
        run: sudo --preserve-env=HOME unshare --net "$(command -v python)" -m pytest tests/test_optional_vgs_dependency.py -k fts_without

  legacy-migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and legacy migration test engine
        run: python -m pip install ".[test]" "kuzu==0.11.3"
      - name: Provision the Ladybug FTS extension
        run: python -c "import ssl; import ladybug; db = ladybug.Database(':memory:'); conn = ladybug.Connection(db); conn.execute('INSTALL fts;').close(); conn.close(); db.close()"
      - name: Test legacy file migration
        run: python -m pytest tests/test_legacy_migration.py
